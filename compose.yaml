services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chewbecca_youtube
      POSTGRES_USER: chewbecca
      POSTGRES_PASSWORD: chewbecca
    ports:
      - "5432:5432"
    volumes:
      - chewbecca-postgres:/var/lib/postgresql/data

volumes:
  chewbecca-postgres:
