spring:
  application:
    name: chewbecca-youtube-analytics-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/chewbecca-youtube;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 301MB
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  community:
    enabled: ${APP_COMMUNITY_ENABLED:false}
    dry-run: ${APP_COMMUNITY_DRY_RUN:true}
  performance:
    enabled: ${APP_PERFORMANCE_ENABLED:false}
    dry-run: ${APP_PERFORMANCE_DRY_RUN:true}
    reporting-enabled: ${APP_PERFORMANCE_REPORTING_ENABLED:false}
    reporting-create-job: ${APP_PERFORMANCE_REPORTING_CREATE_JOB:false}
    reporting-cron: "${APP_PERFORMANCE_REPORTING_CRON:0 20 */6 * * *}"
    end-screen-reporting-enabled: ${APP_PERFORMANCE_END_SCREEN_REPORTING_ENABLED:false}
    end-screen-reporting-cron: "${APP_PERFORMANCE_END_SCREEN_REPORTING_CRON:0 45 */6 * * *}"
    extended-reporting-enabled: ${APP_PERFORMANCE_EXTENDED_REPORTING_ENABLED:false}
    extended-reporting-cron: "${APP_PERFORMANCE_EXTENDED_REPORTING_CRON:0 35 */6 * * *}"
    evaluations-enabled: ${APP_PERFORMANCE_EVALUATIONS_ENABLED:false}
    evaluations-cron: "${APP_PERFORMANCE_EVALUATIONS_CRON:0 10 6 * * *}"
    email-enabled: ${APP_PERFORMANCE_EMAIL_ENABLED:false}
    email-cron: "${APP_PERFORMANCE_EMAIL_CRON:0 30 8 * * MON}"
    email-from: ${APP_PERFORMANCE_EMAIL_FROM:}
    email-to: ${APP_PERFORMANCE_EMAIL_TO:}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth2/google/callback}
    expected-channel-id: ${YOUTUBE_EXPECTED_CHANNEL_ID}
    login-hint: ${GOOGLE_LOGIN_HINT}
  security:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
    gpt-api-key: ${GPT_ACTION_API_KEY}
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
    fail-on-default-secrets: true
  meta:
    enabled: ${META_ENABLED:false}
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    configuration-id: ${META_CONFIG_ID:1046575924525879}
    redirect-uri: ${META_REDIRECT_URI:http://localhost:8080/oauth2/meta/callback}
    graph-api-version: ${META_GRAPH_API_VERSION:v25.0}
    expected-page-id: ${META_EXPECTED_PAGE_ID:}
    expected-instagram-account-id: ${META_EXPECTED_INSTAGRAM_ACCOUNT_ID:}
    default-report-days: 28
    max-insight-range-days: 90
    max-content-items: 500
    token-expiry-fallback-days: 60
  instagram:
    enabled: ${APP_INSTAGRAM_ENABLED:false}
    live-enabled: ${APP_INSTAGRAM_LIVE_ENABLED:false}
    public-url: ${APP_INSTAGRAM_PUBLIC_URL:${MCP_PUBLIC_URL:}}
    scheduler-delay-ms: ${APP_INSTAGRAM_SCHEDULER_DELAY_MS:30000}
    insights-delay-ms: ${APP_INSTAGRAM_INSIGHTS_DELAY_MS:300000}
    reels-enabled: ${APP_INSTAGRAM_REELS_ENABLED:true}
    reels-live-enabled: ${APP_INSTAGRAM_REELS_LIVE_ENABLED:true}
    reels-storage: ${APP_INSTAGRAM_REELS_STORAGE:/var/data/instagram-reels}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    allowed-chat-id: ${TELEGRAM_ALLOWED_CHAT_ID:0}
  telegram-analytics:
    restart-dates: ${CHANNEL_RESTART_DATES:}
    restart-window-days: ${CHANNEL_RESTART_WINDOW_DAYS:30}
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    actions-base-url: ${ASSISTANT_ACTIONS_BASE_URL:}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:3000}
    max-tool-rounds: ${OPENAI_MAX_TOOL_ROUNDS:6}
  chatgpt-bridge:
    enabled: ${CHATGPT_BRIDGE_ENABLED:false}
    bearer-key: ${CHATGPT_BRIDGE_API_KEY:}
    allowed-file-hosts: ${CHATGPT_FILE_ALLOWED_HOSTS:files.oaiusercontent.com,files.openai.com}
  youtube:
    default-report-days: 28
    shorts-duration-fallback-seconds: 180
    shorts-duration-fallback-enabled: true
    shorts-detection-start-date: 2020-09-14
    max-page-size: 500
    forced-short-ids: []
    forced-video-ids: []
logging:
  level:
    it.chewbecca.youtubeanalytics: INFO
# MCP diretto: separato dal bridge Sites e da OAuth Google/YouTube.
# Non abilitarlo fino a review e test dell'autorizzazione end-to-end.
spring.ai.mcp.server.enabled: ${MCP_ENABLED:false}
spring.ai.mcp.server.protocol: STATELESS
spring.ai.mcp.server.name: chewbecca-studio
spring.ai.mcp.server.version: 1.0.0
spring.ai.mcp.server.type: SYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint: /mcp
app.mcp.enabled: ${MCP_ENABLED:false}
app.mcp.public-url: ${MCP_PUBLIC_URL:}
app.mcp.redirect-uri: ${MCP_REDIRECT_URI:https://chatgpt.com/connector_platform_oauth_redirect}
app.mcp.signing-private-key-pkcs8-b64: ${MCP_SIGNING_PRIVATE_KEY_PKCS8_B64:}
