openapi: 3.1.0
info:
  title: I Discorsi di Chewbecca YouTube Analytics API
  version: 1.0.0
  description: >-
    API privata per analizzare il canale YouTube autorizzato. Distingue i valori
    lifetime dalle metriche calcolate nel periodo richiesto.
servers:
  - url: https://YOUR_PUBLIC_DOMAIN
    description: Sostituisci con il dominio HTTPS dell'applicazione
security:
  - bearerApiKey: []
paths:
  /api/v1/channel/summary:
    get:
      operationId: getChannelSummary
      summary: Ottiene il riepilogo del canale
      description: Restituisce iscritti, visualizzazioni e video lifetime, oltre alle metriche del periodo.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Riepilogo del canale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSummary'
  /api/v1/channel/trend:
    get:
      operationId: getChannelTrend
      summary: Ottiene l'andamento del canale
      description: Restituisce le metriche aggregate per giorno o mese.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: granularity
          in: query
          schema:
            type: string
            enum: [DAY, MONTH]
            default: DAY
      responses:
        '200':
          description: Serie temporale del canale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
  /api/v1/content:
    get:
      operationId: listContentPerformance
      summary: Elenca le performance di video e Short
      description: >-
        Restituisce metadata, valori lifetime e metriche del periodo. Usa type=SHORT
        per i soli Short e type=VIDEO per i video tradizionali.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: type
          in: query
          schema:
            type: string
            enum: [ALL, VIDEO, SHORT]
            default: ALL
        - name: query
          in: query
          description: Ricerca parziale, senza distinzione tra maiuscole e minuscole, nel titolo o nel video ID.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [VIEWS, ENGAGED_VIEWS, LIKES, COMMENTS, SHARES, WATCH_TIME, AVERAGE_VIEW_PERCENTAGE, SUBSCRIBERS_GAINED, PUBLISHED_AT]
            default: VIEWS
        - name: order
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: Pagina di contenuti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
  /api/v1/content/summary:
    get:
      operationId: getContentTypeSummary
      summary: Confronta video e Short
      description: Restituisce metriche aggregate separate per video tradizionali e Short.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Riepilogo per tipologia di contenuto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSummaryResponse'
  /api/v1/content/{videoId}:
    get:
      operationId: getContentDetails
      summary: Ottiene il dettaglio di un video o Short
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Dettaglio del contenuto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/content/{videoId}/trend:
    get:
      operationId: getContentTrend
      summary: Ottiene l'andamento di un contenuto
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: granularity
          in: query
          schema:
            type: string
            enum: [DAY, MONTH]
            default: DAY
      responses:
        '200':
          description: Serie temporale del contenuto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
  /api/v1/content/{videoId}/traffic-sources:
    get:
      operationId: getContentTrafficSources
      summary: Ottiene le sorgenti di traffico di un contenuto
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Breakdown per sorgente di traffico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
  /api/v1/content/{videoId}/countries:
    get:
      operationId: getContentCountries
      summary: Ottiene i principali Paesi di un contenuto
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: Breakdown per Paese
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
  parameters:
    StartDate:
      name: startDate
      in: query
      description: Data iniziale inclusa in formato YYYY-MM-DD. Se omessa, usa gli ultimi 28 giorni completi.
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      description: Data finale inclusa in formato YYYY-MM-DD. Se omessa, usa ieri nel fuso YouTube Analytics.
      schema:
        type: string
        format: date
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Contenuto non appartenente al canale collegato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ReportPeriod:
      type: object
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        analyticsTimeZone: { type: string }
    AnalyticsMetrics:
      type: object
      properties:
        engagedViews: { type: integer, format: int64 }
        views: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
        likes: { type: integer, format: int64 }
        shares: { type: integer, format: int64 }
        estimatedMinutesWatched: { type: number, format: double }
        estimatedHoursWatched: { type: number, format: double }
        averageViewDurationSeconds: { type: number, format: double }
        averageViewPercentage: { type: number, format: double }
        subscribersGained: { type: integer, format: int64 }
        subscribersLost: { type: integer, format: int64 }
        netSubscribers: { type: integer, format: int64 }
        engagementRatePercentage: { type: number, format: double }
    LifetimeChannelMetrics:
      type: object
      properties:
        subscribers: { type: integer, format: int64 }
        subscribersHidden: { type: boolean }
        subscriberCountRoundedByYouTube: { type: boolean }
        views: { type: integer, format: int64 }
        publishedVideos: { type: integer, format: int64 }
    LifetimeContentMetrics:
      type: object
      properties:
        views: { type: integer, format: int64 }
        likes: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
    ChannelSummary:
      type: object
      properties:
        channelId: { type: string }
        channelTitle: { type: string }
        customUrl: { type: [string, 'null'] }
        thumbnailUrl: { type: [string, 'null'] }
        lifetime: { $ref: '#/components/schemas/LifetimeChannelMetrics' }
        period: { $ref: '#/components/schemas/ReportPeriod' }
        periodMetrics: { $ref: '#/components/schemas/AnalyticsMetrics' }
        generatedAt: { type: string, format: date-time }
        note: { type: string }
    TrendPoint:
      type: object
      properties:
        period: { type: string }
        metrics: { $ref: '#/components/schemas/AnalyticsMetrics' }
    TrendResponse:
      type: object
      properties:
        scope: { type: string }
        videoId: { type: [string, 'null'] }
        reportPeriod: { $ref: '#/components/schemas/ReportPeriod' }
        granularity: { type: string, enum: [DAY, MONTH] }
        points:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }
    ContentPerformanceItem:
      type: object
      properties:
        videoId: { type: string }
        title: { type: string }
        contentType: { type: string, enum: [VIDEO, SHORT] }
        contentTypeDetection: { type: string }
        classificationConfidence: { type: string }
        publishedAt: { type: [string, 'null'], format: date-time }
        durationSeconds: { type: integer, format: int64 }
        youtubeUrl: { type: string }
        thumbnailUrl: { type: [string, 'null'] }
        privacyStatus: { type: string }
        lifetime: { $ref: '#/components/schemas/LifetimeContentMetrics' }
        periodMetrics: { $ref: '#/components/schemas/AnalyticsMetrics' }
    ContentListResponse:
      type: object
      properties:
        period: { $ref: '#/components/schemas/ReportPeriod' }
        type: { type: string, enum: [ALL, VIDEO, SHORT] }
        query: { type: [string, 'null'] }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        sortBy: { type: string }
        order: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentPerformanceItem' }
    ContentTypeSummary:
      type: object
      properties:
        contentType: { type: string, enum: [VIDEO, SHORT] }
        totalPublished: { type: integer, format: int64 }
        publishedInPeriod: { type: integer, format: int64 }
        lifetime: { $ref: '#/components/schemas/LifetimeContentMetrics' }
        periodMetrics: { $ref: '#/components/schemas/AnalyticsMetrics' }
    ContentSummaryResponse:
      type: object
      properties:
        period: { $ref: '#/components/schemas/ReportPeriod' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ContentTypeSummary' }
    ContentDetail:
      allOf:
        - $ref: '#/components/schemas/ContentPerformanceItem'
        - type: object
          properties:
            description: { type: string }
            tags:
              type: array
              items: { type: string }
            categoryId: { type: [string, 'null'] }
            liveBroadcastContent: { type: string }
            madeForKids: { type: boolean }
            selfDeclaredMadeForKids: { type: boolean }
            available: { type: boolean }
            period: { $ref: '#/components/schemas/ReportPeriod' }
    BreakdownItem:
      type: object
      properties:
        value: { type: string }
        engagedViews: { type: integer, format: int64 }
        views: { type: integer, format: int64 }
        estimatedMinutesWatched: { type: number, format: double }
        estimatedHoursWatched: { type: number, format: double }
        averageViewDurationSeconds: { type: number, format: double }
        averageViewPercentage: { type: number, format: double }
        netSubscribers: { type: integer, format: int64 }
    BreakdownResponse:
      type: object
      properties:
        videoId: { type: string }
        dimension: { type: string }
        period: { $ref: '#/components/schemas/ReportPeriod' }
        items:
          type: array
          items: { $ref: '#/components/schemas/BreakdownItem' }
    ApiError:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
