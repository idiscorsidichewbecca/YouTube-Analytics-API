openapi: 3.1.0
info:
  title: I Discorsi di Chewbecca Social Analytics API
  version: 2.0.0
  description: API privata per analizzare YouTube, Facebook e Instagram. Gli endpoint sono distinti per piattaforma
    e le risposte separano metadati, metriche del periodo, insight lifetime e warning delle API provider.
servers:
- url: https://YOUR_PUBLIC_DOMAIN
  description: Sostituisci con il dominio HTTPS dell'applicazione
security:
- bearerApiKey: []
paths:
  /api/v1/channel/summary:
    get:
      operationId: getChannelSummary
      summary: Ottiene il riepilogo del canale
      description: Restituisce iscritti, visualizzazioni e video lifetime, oltre alle metriche del periodo.
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Riepilogo del canale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSummary'
  /api/v1/channel/trend:
    get:
      operationId: getChannelTrend
      summary: Ottiene l'andamento del canale
      description: Restituisce le metriche aggregate per giorno o mese.
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - name: granularity
        in: query
        schema:
          type: string
          enum:
          - DAY
          - MONTH
          default: DAY
      responses:
        '200':
          description: Serie temporale del canale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
  /api/v1/channel/subscription-status:
    get:
      operationId: getChannelSubscriptionStatus
      summary: Confronta spettatori iscritti e non iscritti
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Breakdown per stato di iscrizione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
  /api/v1/channel/devices:
    get:
      operationId: getChannelDevices
      summary: Ottiene la distribuzione per dispositivo
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Breakdown per tipo di dispositivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
  /api/v1/channel/operating-systems:
    get:
      operationId: getChannelOperatingSystems
      summary: Ottiene la distribuzione per sistema operativo
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      responses:
        '200':
          description: Breakdown per sistema operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
  /api/v1/channel/demographics:
    get:
      operationId: getChannelDemographics
      summary: Ottiene la distribuzione demografica
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Distribuzione per età e genere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemographicsResponse'
  /api/v1/content:
    get:
      operationId: listContentPerformance
      summary: Elenca le performance di video e Short
      description: Restituisce metadata, valori lifetime e metriche del periodo. Usa type=SHORT per i soli Short
        e type=VIDEO per i video tradizionali.
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - name: type
        in: query
        schema:
          type: string
          enum:
          - ALL
          - VIDEO
          - SHORT
          default: ALL
      - name: query
        in: query
        description: Ricerca parziale, senza distinzione tra maiuscole e minuscole, nel titolo o nel video ID.
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - VIEWS
          - ENGAGED_VIEWS
          - LIKES
          - COMMENTS
          - SHARES
          - WATCH_TIME
          - AVERAGE_VIEW_PERCENTAGE
          - SUBSCRIBERS_GAINED
          - PUBLISHED_AT
          default: VIEWS
      - name: order
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
          default: DESC
      responses:
        '200':
          description: Pagina di contenuti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
  /api/v1/content/summary:
    get:
      operationId: getContentTypeSummary
      summary: Confronta video e Short
      description: Restituisce metriche aggregate separate per video tradizionali e Short.
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Riepilogo per tipologia di contenuto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSummaryResponse'
  /api/v1/content/{videoId}:
    get:
      operationId: getContentDetails
      summary: Ottiene il dettaglio di un video o Short
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Dettaglio del contenuto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/content/{videoId}/trend:
    get:
      operationId: getContentTrend
      summary: Ottiene l'andamento di un contenuto
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - name: granularity
        in: query
        schema:
          type: string
          enum:
          - DAY
          - MONTH
          default: DAY
      responses:
        '200':
          description: Serie temporale del contenuto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
  /api/v1/content/{videoId}/traffic-sources:
    get:
      operationId: getContentTrafficSources
      summary: Ottiene le sorgenti di traffico di un contenuto
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Breakdown per sorgente di traffico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
  /api/v1/content/{videoId}/countries:
    get:
      operationId: getContentCountries
      summary: Ottiene i principali Paesi di un contenuto
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      responses:
        '200':
          description: Breakdown per Paese
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
  /api/v1/content/{videoId}/retention:
    get:
      operationId: getContentRetention
      summary: Ottiene la curva di fidelizzazione del pubblico
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Curva di retention del contenuto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionResponse'
  /api/v1/content/{videoId}/subscription-status:
    get:
      operationId: getContentSubscriptionStatus
      summary: Confronta spettatori iscritti e non iscritti
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Breakdown per stato di iscrizione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
  /api/v1/content/{videoId}/devices:
    get:
      operationId: getContentDevices
      summary: Ottiene la distribuzione per dispositivo
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Breakdown per tipo di dispositivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
  /api/v1/content/{videoId}/traffic-source-details:
    get:
      operationId: getContentTrafficSourceDetails
      summary: Ottiene i dettagli di una sorgente di traffico
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - name: sourceType
        in: query
        required: true
        description: Tipo restituito da traffic-sources, ad esempio YT_SEARCH o RELATED_VIDEO.
        schema:
          type: string
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      responses:
        '200':
          description: Dettagli della sorgente di traffico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficSourceDetailsResponse'
  /api/v1/meta/overview:
    get:
      operationId: getMetaOverview
      summary: Riepilogo combinato Facebook e Instagram
      responses:
        '200':
          description: Riepilogo combinato Facebook e Instagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaOverview'
      parameters:
      - &id001
        $ref: '#/components/parameters/StartDate'
      - &id002
        $ref: '#/components/parameters/EndDate'
  /api/v1/meta/facebook/page:
    get:
      operationId: getFacebookPage
      summary: Metadati della Pagina Facebook collegata
      responses:
        '200':
          description: Metadati della Pagina Facebook collegata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookPage'
  /api/v1/meta/facebook/summary:
    get:
      operationId: getFacebookSummary
      summary: Riepilogo Facebook nel periodo
      responses:
        '200':
          description: Riepilogo Facebook nel periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookSummary'
      parameters:
      - *id001
      - *id002
  /api/v1/meta/facebook/trend:
    get:
      operationId: getFacebookTrend
      summary: Trend giornaliero Facebook
      responses:
        '200':
          description: Trend giornaliero Facebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaTrendResponse'
      parameters:
      - *id001
      - *id002
      - &id003
        $ref: '#/components/parameters/MetaMetrics'
  /api/v1/meta/facebook/insights:
    get:
      operationId: getFacebookInsights
      summary: Insight Facebook per metriche personalizzate
      responses:
        '200':
          description: Insight Facebook per metriche personalizzate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaInsightsResponse'
      parameters:
      - *id001
      - *id002
      - *id003
      - name: period
        in: query
        schema:
          type: string
          default: day
  /api/v1/meta/facebook/posts:
    get:
      operationId: listFacebookPosts
      summary: Elenca post Facebook
      responses:
        '200':
          description: Elenca post Facebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookContentListResponse'
      parameters:
      - *id001
      - *id002
      - name: type
        in: query
        schema:
          type: string
          enum: &id004
          - ALL
          - POST
          - PHOTO
          - VIDEO
          - LINK
          - REEL
          default: ALL
      - $ref: '#/components/parameters/MetaQuery'
      - $ref: '#/components/parameters/MetaPage'
      - $ref: '#/components/parameters/MetaSize'
      - $ref: '#/components/parameters/MetaSortBy'
      - $ref: '#/components/parameters/MetaOrder'
      - $ref: '#/components/parameters/IncludeInsights'
  /api/v1/meta/facebook/posts/{postId}:
    get:
      operationId: getFacebookPost
      summary: Dettaglio post Facebook
      responses:
        '200':
          description: Dettaglio post Facebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookContentItem'
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
      - name: includeInsights
        in: query
        schema:
          type: boolean
          default: true
  /api/v1/meta/facebook/posts/{postId}/insights:
    get:
      operationId: getFacebookPostInsights
      summary: Insight lifetime di un post Facebook
      responses:
        '200':
          description: Insight lifetime di un post Facebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaInsightsResponse'
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
      - *id003
  /api/v1/meta/facebook/videos:
    get:
      operationId: listFacebookVideos
      summary: Elenca video Facebook
      responses:
        '200':
          description: Elenca video Facebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookVideoListResponse'
      parameters:
      - *id001
      - *id002
      - $ref: '#/components/parameters/MetaQuery'
      - $ref: '#/components/parameters/MetaPage'
      - $ref: '#/components/parameters/MetaSize'
      - $ref: '#/components/parameters/MetaSortBy'
      - $ref: '#/components/parameters/MetaOrder'
      - $ref: '#/components/parameters/IncludeInsights'
  /api/v1/meta/facebook/reels:
    get:
      operationId: listFacebookReels
      summary: Elenca Reel Facebook
      responses:
        '200':
          description: Elenca Reel Facebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookVideoListResponse'
      description: La classificazione Reel può includere un’euristica quando Meta non espone un tipo univoco.
      parameters:
      - *id001
      - *id002
      - $ref: '#/components/parameters/MetaQuery'
      - $ref: '#/components/parameters/MetaPage'
      - $ref: '#/components/parameters/MetaSize'
      - $ref: '#/components/parameters/MetaSortBy'
      - $ref: '#/components/parameters/MetaOrder'
      - $ref: '#/components/parameters/IncludeInsights'
  /api/v1/meta/facebook/videos/{videoId}:
    get:
      operationId: getFacebookVideo
      summary: Dettaglio video Facebook
      responses:
        '200':
          description: Dettaglio video Facebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookVideoItem'
      parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: string
      - name: includeInsights
        in: query
        schema:
          type: boolean
          default: true
  /api/v1/meta/facebook/videos/{videoId}/insights:
    get:
      operationId: getFacebookVideoInsights
      summary: Insight lifetime di un video Facebook
      responses:
        '200':
          description: Insight lifetime di un video Facebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaInsightsResponse'
      parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: string
      - *id003
  /api/v1/meta/facebook/top-content:
    get:
      operationId: getFacebookTopContent
      summary: Classifica contenuti Facebook
      responses:
        '200':
          description: Classifica contenuti Facebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookContentListResponse'
      parameters:
      - *id001
      - *id002
      - name: type
        in: query
        schema:
          type: string
          enum: *id004
          default: ALL
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - PUBLISHED_AT
          - VIEWS
          - REACH
          - LIKES
          - COMMENTS
          - SHARES
          - SAVES
          - ENGAGEMENT
          default: REACH
  /api/v1/meta/instagram/account:
    get:
      operationId: getInstagramAccount
      summary: Metadati dell’account Instagram collegato
      responses:
        '200':
          description: Metadati dell’account Instagram collegato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramAccount'
  /api/v1/meta/instagram/summary:
    get:
      operationId: getInstagramSummary
      summary: Riepilogo Instagram nel periodo
      responses:
        '200':
          description: Riepilogo Instagram nel periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramSummary'
      parameters:
      - *id001
      - *id002
  /api/v1/meta/instagram/trend:
    get:
      operationId: getInstagramTrend
      summary: Trend giornaliero Instagram
      responses:
        '200':
          description: Trend giornaliero Instagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaTrendResponse'
      parameters:
      - *id001
      - *id002
      - *id003
  /api/v1/meta/instagram/insights:
    get:
      operationId: getInstagramInsights
      summary: Insight Instagram per metriche personalizzate
      responses:
        '200':
          description: Insight Instagram per metriche personalizzate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaInsightsResponse'
      parameters:
      - *id001
      - *id002
      - *id003
      - name: period
        in: query
        schema:
          type: string
      - name: metricType
        in: query
        schema:
          type: string
      - name: breakdown
        in: query
        schema:
          type: string
      - name: timeframe
        in: query
        schema:
          type: string
  /api/v1/meta/instagram/media:
    get:
      operationId: listInstagramMedia
      summary: Elenca contenuti Instagram
      responses:
        '200':
          description: Elenca contenuti Instagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramMediaListResponse'
      parameters:
      - *id001
      - *id002
      - name: type
        in: query
        schema:
          type: string
          enum: &id005
          - ALL
          - IMAGE
          - VIDEO
          - CAROUSEL
          - REEL
          - STORY
          default: ALL
      - $ref: '#/components/parameters/MetaQuery'
      - $ref: '#/components/parameters/MetaPage'
      - $ref: '#/components/parameters/MetaSize'
      - $ref: '#/components/parameters/MetaSortBy'
      - $ref: '#/components/parameters/MetaOrder'
      - $ref: '#/components/parameters/IncludeInsights'
  /api/v1/meta/instagram/reels:
    get:
      operationId: listInstagramReels
      summary: Elenca Reel Instagram
      responses:
        '200':
          description: Elenca Reel Instagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramMediaListResponse'
      parameters:
      - *id001
      - *id002
      - $ref: '#/components/parameters/MetaQuery'
      - $ref: '#/components/parameters/MetaPage'
      - $ref: '#/components/parameters/MetaSize'
      - $ref: '#/components/parameters/MetaSortBy'
      - $ref: '#/components/parameters/MetaOrder'
      - $ref: '#/components/parameters/IncludeInsights'
  /api/v1/meta/instagram/stories:
    get:
      operationId: listInstagramStories
      summary: Elenca storie Instagram ancora attive
      responses:
        '200':
          description: Elenca storie Instagram ancora attive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramMediaListResponse'
      parameters:
      - $ref: '#/components/parameters/IncludeInsights'
  /api/v1/meta/instagram/media/{mediaId}:
    get:
      operationId: getInstagramMedia
      summary: Dettaglio contenuto Instagram
      responses:
        '200':
          description: Dettaglio contenuto Instagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramMediaItem'
      parameters:
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
      - name: includeInsights
        in: query
        schema:
          type: boolean
          default: true
  /api/v1/meta/instagram/media/{mediaId}/insights:
    get:
      operationId: getInstagramMediaInsights
      summary: Insight lifetime di un contenuto Instagram
      responses:
        '200':
          description: Insight lifetime di un contenuto Instagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaInsightsResponse'
      parameters:
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
      - *id003
  /api/v1/meta/instagram/top-content:
    get:
      operationId: getInstagramTopContent
      summary: Classifica contenuti Instagram
      responses:
        '200':
          description: Classifica contenuti Instagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramMediaListResponse'
      parameters:
      - *id001
      - *id002
      - name: type
        in: query
        schema:
          type: string
          enum: *id005
          default: ALL
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - PUBLISHED_AT
          - VIEWS
          - REACH
          - LIKES
          - COMMENTS
          - SHARES
          - SAVES
          - ENGAGEMENT
          default: REACH
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
  parameters:
    StartDate:
      name: startDate
      in: query
      description: Data iniziale inclusa in formato YYYY-MM-DD. Se omessa, usa gli ultimi 28 giorni completi.
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      description: Data finale inclusa in formato YYYY-MM-DD. Se omessa, usa ieri nel fuso YouTube Analytics.
      schema:
        type: string
        format: date
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
    MetaObjectId:
      name: objectId
      in: path
      required: true
      schema:
        type: string
      description: ID Meta del contenuto.
    MetaMetrics:
      name: metrics
      in: query
      description: Nomi delle metriche separati da virgole. Massimo 25.
      schema:
        type: string
    MetaPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    MetaSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    MetaQuery:
      name: query
      in: query
      description: Ricerca testuale nel contenuto e nell’ID.
      schema:
        type: string
    MetaSortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
        - PUBLISHED_AT
        - VIEWS
        - REACH
        - LIKES
        - COMMENTS
        - SHARES
        - SAVES
        - ENGAGEMENT
        default: PUBLISHED_AT
    MetaOrder:
      name: order
      in: query
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: DESC
    IncludeInsights:
      name: includeInsights
